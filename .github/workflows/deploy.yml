name: Tests et déploiement o2switch (FTPS)

# manifesto-sign.otspi.org est servi par o2switch. Chaque push sur main passe le test de bout en bout,
# puis envoie le code. config.php et data/ (base SQLite) restent sur le serveur et ne sont jamais touchés.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('tests-{0}', github.ref) || 'deploy' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test de bout en bout
        run: bash tests/flow.sh

  deploy:
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Environnement GitHub : on peut y exiger une approbation manuelle avant chaque mise en production.
    environment:
      name: production
      url: https://manifesto-sign.otspi.org/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installation de lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Compte FTP dédié, cantonné au répertoire de l'application (le parent de public/) ; TLS obligatoire
      # et certificat vérifié. Seuls les dossiers de code sont envoyés, config.php et data/ ne sont jamais
      # visés. src/ part avant public/ : pendant les quelques secondes de l'envoi, d'anciennes pages avec
      # la nouvelle bibliothèque restent fonctionnelles, alors que l'inverse appellerait des fonctions
      # absentes. --delete retire le code supprimé du dépôt ; .well-known/ (certificats), cgi-bin/ et error_log
      # (créés par le serveur) sont préservés.
      - name: Déploiement FTPS
        env:
          FTP_HOST: ${{ vars.O2_FTP_HOST }}
          FTP_DIR: ${{ vars.O2_SIGN_FTP_DIR || '.' }}
          FTP_USERNAME: ${{ secrets.O2_SIGN_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.O2_SIGN_FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME" --env-password "ftp://$FTP_HOST" -e "
            set cmd:fail-exit yes;
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data yes;
            set ssl:verify-certificate yes;
            set ftp:passive-mode yes;
            set net:max-retries 2;
            cd '$FTP_DIR';
            mkdir -p -f bin cron src public;
            mirror --reverse --delete --verbose --no-perms bin/ bin/;
            mirror --reverse --delete --verbose --no-perms cron/ cron/;
            mirror --reverse --delete --verbose --no-perms src/ src/;
            mirror --reverse --delete --verbose --no-perms --exclude '^\\.well-known/' --exclude '^cgi-bin/' --exclude '^error_log$' public/ public/;
            bye"

      # Contrôle en lecture seule : formulaire et page d'erreur de l'application, fichiers hors de public/
      # non servis. signataires.php n'est pas interrogé : o2switch ne répond pas à cette adresse depuis
      # les serveurs de GitHub Actions (délai dépassé), alors qu'elle répond normalement ailleurs.
      - name: Vérification du site
        run: |
          set -euo pipefail
          U=https://manifesto-sign.otspi.org
          [ "$(curl -s -o /dev/null -w '%{http_code}' -m 20 "$U/")" = 200 ] || { echo "formulaire inaccessible"; exit 1; }
          # Page lue en entier avant la recherche : avec « curl | grep -q » et pipefail, grep s'arrête au
          # premier résultat et curl, coupé en plein transfert, fait échouer l'étape (code 92).
          page=$(curl -s -m 20 "$U/page-inexistante")
          grep -q 'class="card"' <<<"$page" || { echo "page 404 de l'application absente"; exit 1; }
          for p in /config.php /src/lib.php /bin/moderation.php /data/signatures.sqlite; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "$U$p")
            [ "$code" = 404 ] || [ "$code" = 403 ] || { echo "$p exposé ($code)"; exit 1; }
          done
          echo "Site vérifié."
